# nfpm 打包配置（deb / rpm / Arch 共用一份，见 docs/tech-stack.md「分发产物」）。
# 二进制先按架构落到 dist/stage/ 再打包（nfpm 不对 contents.src 做环境变量展开）：
#   mkdir -p dist/stage && cp dist/bin/<arch>/* dist/stage/
#   VERSION=1.0.0 nfpm pkg --config packaging/nfpm.yaml --packager deb --target /tmp/
name: appclone
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: mensylisir <710080675@qq.com>
vendor: mensylisir
homepage: https://github.com/mensylisir/appclone
# SPDX 标识符；deb/rpm/Arch 的元数据分别落到 control 的 License 字段、
# rpm 的 License: 标签与 .PKGINFO 的 license=。
license: GPL-3.0-or-later
description: |
  为任意 Linux 应用再开一个分身（只隔离它自己的数据）。
  bubblewrap 实现 per-app 沙箱；公共文件与桌面会话照常共享；GUI 与 CLI 共用同一份
  core 与实例目录。无需 root、无 daemon。
# 硬依赖清单是安装契约：新增/删除下面任一 depends 条目（含 overrides 里的
# 三份）时必须同步 .github/workflows/ci.yml 的 packages job——它按三种格式
# 逐项断言这份清单，漏改会让包元数据与门禁脱节。
depends:
  - bubblewrap

overrides:
  deb:
    depends:
      - libgtk-4-1 (>= 4.14)
      - libadwaita-1-0 (>= 1.5)
      - bubblewrap
      - desktop-file-utils
      # 路径探测主后端与兜底后端都是产品能力，不是可选优化（ADR-032）：
      # 缺 fuse-overlayfs 只能走低置信度 strace，两者都缺则新应用无法首次探测。
      - fuse-overlayfs
      - strace
      # 删除进回收站依赖 /usr/bin/gio；它不在 libglib2.0-0t64 里。
      - libglib2.0-bin
    recommends:
      # postinstall 的图标缓存更新器在 Debian 系属于 libgtk-4-bin；
      # 只装运行库时该步骤会 best-effort 跳过（SVG 仍能按路径加载）。
      - libgtk-4-bin
  rpm:
    depends:
      - gtk4 >= 4.14
      - libadwaita >= 1.5
      - bubblewrap
      - desktop-file-utils
      - glib2
      - fuse-overlayfs
      - strace
  # ADR-032：探测后端是硬依赖，安装即带上；Arch 的 optdepends 不参与表达。
  archlinux:
    depends:
      - gtk4>=4.14
      - libadwaita>=1.5
      - bubblewrap
      - desktop-file-utils
      - glib2
      - fuse-overlayfs
      - strace

# Arch 专属钩子必须放在顶层 archlinux，不能放进 overrides（overrides 的
# scripts 是通用 Scripts，没有 postupgrade 字段）。pacman 升级时只跑
# post_upgrade，不会重跑 post_install；不接这条，v1.0.0 装的「无标记」
# /etc/apparmor.d/bwrap 在 Arch 升级后仍无法被 postremove 回收。
# 脚本本身按目标状态幂等，无需区分安装/升级。
archlinux:
  scripts:
    postupgrade: packaging/postinstall.sh

contents:
  - src: dist/stage/appclone
    dst: /usr/bin/appclone
    file_info:
      mode: 0755
  - src: dist/stage/appclone-gui
    dst: /usr/bin/appclone-gui
    file_info:
      mode: 0755
  - src: packaging/io.github.mensylisir.Appclone.desktop
    dst: /usr/share/applications/io.github.mensylisir.Appclone.desktop
  - src: packaging/io.github.mensylisir.Appclone.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.mensylisir.Appclone.svg
  - src: packaging/bwrap.apparmor
    dst: /usr/share/appclone/bwrap.apparmor
  # 许可证文本随包分发：rpm/Arch 用 /usr/share/licenses/<name>/（各自惯例），
  # deb 按 Debian Policy §12.5 放 /usr/share/doc/<name>/copyright（DEP-5，含版权人
  # 与 "or later" 声明）；第三方模块的许可证全文单独成文件。
  - src: THIRD_PARTY_NOTICES
    dst: /usr/share/licenses/appclone/THIRD_PARTY_NOTICES
    packager: rpm
  - src: THIRD_PARTY_NOTICES
    dst: /usr/share/licenses/appclone/THIRD_PARTY_NOTICES
    packager: archlinux
  - src: THIRD_PARTY_NOTICES
    dst: /usr/share/doc/appclone/THIRD_PARTY_NOTICES
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/appclone/LICENSE
    packager: rpm
  - src: LICENSE
    dst: /usr/share/licenses/appclone/LICENSE
    packager: archlinux
  - src: packaging/copyright
    dst: /usr/share/doc/appclone/copyright
    packager: deb

scripts:
  postinstall: packaging/postinstall.sh
  # 卸载回收：只删 postinstall 自己装的那份 /etc/apparmor.d/bwrap（带标记行）。
  postremove: packaging/postremove.sh
