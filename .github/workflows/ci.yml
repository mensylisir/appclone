# 持续集成：每次 push/PR 都跑完整门禁。
# 刻意与发版分开（release.yml）：打包失败不该阻塞日常开发，
# 但代码门禁失败绝不该进 main。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 发版前由 release.yml 复用整套门禁（Go/HTML/GTK/GTK-arm），
  # tag 可以指向任意提交，不能只信 main 上那次 CI。
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go 门禁（gofmt/vet/staticcheck/test/race/交叉编译）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt（有输出即失败）
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "以下文件未格式化："; echo "$out"; exit 1; fi

      - name: go vet（默认）
        run: go vet ./...

      # gtk_e2e 测试文件只在 GTK 机器上运行；这里只做类型检查，
      # puregotk 编译期不需要 GTK 开发包（dlopen 在运行期）。
      - name: go vet（gtk_e2e）
        run: go vet -tags gtk_e2e ./cmd/appclone-gui

      - name: staticcheck
        run: |
          # 静态检查工具版本 2026.2.2 对应的 module tag 是 v0.8.2。
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" -version
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: go test
        run: go test -count=1 ./...

      # -race 需要 cgo（构建仍按发布形态走 CGO_ENABLED=0）。
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./core/... ./cmd/appclone

      - name: 零 cgo 构建 + 两架构交叉编译
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -o /tmp/appclone-"$arch" ./cmd/appclone
            GOOS=linux GOARCH="$arch" go build -trimpath -o /tmp/appclone-gui-"$arch" ./cmd/appclone-gui
          done

  packages:
    # 打包配置也会腐坏：每次 push 都真出一遍 amd64 三格式包，而不是等到打 tag
    # 才发现 nfpm 字段/依赖/落点坏了。arm64 包由 release 的矩阵覆盖。
    name: 安装包构建（deb/rpm/Arch，amd64）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装 nfpm（固定版本 + 校验和）
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz
          echo "2fec509cc508fd7688b03f1426747725e93e024ff3c94a7f02022a50ddaa6c04  /tmp/nfpm.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
      - name: 构建 amd64 二进制并出包
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/stage dist/pkg
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=0.0.0" -o dist/stage/appclone ./cmd/appclone
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=0.0.0" -o dist/stage/appclone-gui ./cmd/appclone-gui
          for f in dist/stage/appclone dist/stage/appclone-gui; do
            file "$f" | grep -q "x86-64" || { echo "::error::$f 不是 amd64"; file "$f"; exit 1; }
          done
          for fmt in deb rpm archlinux; do
            GOARCH=amd64 VERSION=0.0.0 nfpm pkg --config packaging/nfpm.yaml --packager "$fmt" --target dist/pkg/
          done
          ls -l dist/pkg
          ar p dist/pkg/appclone_0.0.0_amd64.deb control.tar.gz | tar -xzO ./control > /tmp/control
          grep -qx 'Architecture: amd64' /tmp/control
          grep -q '^Depends: .*bubblewrap' /tmp/control
          grep -q '^Depends: .*desktop-file-utils' /tmp/control
          grep -q '^Depends: .*libglib2.0-bin' /tmp/control
          grep -q '^Recommends: .*fuse-overlayfs' /tmp/control
          grep -q '^Recommends: .*strace' /tmp/control
          ar p dist/pkg/appclone_0.0.0_amd64.deb data.tar.gz | tar -tzf - > /tmp/data
          for p in ./usr/bin/appclone ./usr/bin/appclone-gui \
                   ./usr/share/applications/io.github.mensylisir.Appclone.desktop \
                   ./usr/share/icons/hicolor/scalable/apps/io.github.mensylisir.Appclone.svg; do
            grep -qx "$p" /tmp/data || { echo "::error::deb 缺少 $p"; exit 1; }
          done

  html:
    name: GUI 设计稿交互回归（62 项）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: 安装 puppeteer-core 并跑 HTML 闸门
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm install --no-save puppeteer-core@25.16.0
          node design/guitest.js

  gtk:
    name: GTK 闸门（ubuntu-24.04 / amd64）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装 GTK4/libadwaita 运行库与 xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libadwaita-1-0 bubblewrap fuse-overlayfs xvfb libglib2.0-bin apparmor dbus strace
      - name: 放行 bwrap 的 user namespace（Ubuntu 24.04 的 AppArmor 限制）
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo cp packaging/bwrap.apparmor /etc/apparmor.d/bwrap
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
      - name: design/guitest-gtk.sh
        env:
          # 无 GPU 的 runner 上 GLX 上下文可能被 X 拒绝（BadAccess），
          # 闸门不需要 GL 渲染；cairo 在有/无显示的机器上都稳。
          GSK_RENDERER: cairo
        run: xvfb-run -a -s "-screen 0 1280x1024x24" design/guitest-gtk.sh

  gtk-arm:
    # arm64 是「能编译 ≠ 跑过」：必须在真实 arm64 上跑一遍 GUI 闸门
    # （tech-stack §6「CPU 架构」）。GitHub 的 arm hosted runner 已 GA。
    name: GTK 闸门（ubuntu-24.04-arm / arm64）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装 GTK4/libadwaita 运行库与 xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libadwaita-1-0 bubblewrap fuse-overlayfs xvfb libglib2.0-bin apparmor dbus strace
      - name: 放行 bwrap 的 user namespace（Ubuntu 24.04 的 AppArmor 限制）
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo cp packaging/bwrap.apparmor /etc/apparmor.d/bwrap
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
      - name: design/guitest-gtk.sh
        env:
          # 无 GPU 的 runner 上 GLX 上下文可能被 X 拒绝（BadAccess），
          # 闸门不需要 GL 渲染；cairo 在有/无显示的机器上都稳。
          GSK_RENDERER: cairo
        run: xvfb-run -a -s "-screen 0 1280x1024x24" design/guitest-gtk.sh
